# =============================================================================
# Tahdheer — pgBackRest configuration TEMPLATE (MIP §11.6)
# Deploy to /etc/pgbackrest/pgbackrest.conf on the DB host (or backup sidecar).
# Secrets (cipher pass) must come from SOPS+age-managed provisioning — never
# commit real values. Placeholders below are FAKE.
# =============================================================================

[global]
# Local repository (repo1). Off-site copies are taken by Restic from this path
# (encrypted with age) — see infrastructure/backups/README.md.
repo1-path=/var/lib/pgbackrest

# Retention: 30 daily fulls + 12 monthly (monthly set kept via a second
# retention window managed by the archive job — see backups/README.md).
repo1-retention-full=30
repo1-retention-full-type=count

# Encrypt the repo at rest.
repo1-cipher-type=aes-256-cbc
repo1-cipher-pass=CHANGE_ME_FAKE_CIPHER_PASS

process-max=2
log-level-console=info
log-level-file=detail
start-fast=y

# Asynchronous WAL archiving (continuous — RPO driver, target ≤1h; actual WAL
# push is near-continuous, so effective RPO is minutes).
archive-async=y
spool-path=/var/spool/pgbackrest

[tahdheer]
# Path INSIDE the postgres container volume as seen by pgbackrest.
# When running pgbackrest on the host against the named volume, resolve the
# mountpoint with: docker volume inspect tahdheer_postgres_data
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=postgres

# -----------------------------------------------------------------------------
# postgresql.conf settings required on the cluster (provisioning applies them):
#   archive_mode = on
#   archive_command = 'pgbackrest --stanza=tahdheer archive-push %p'
#   wal_level = replica
#   max_wal_senders = 3
# -----------------------------------------------------------------------------
