# Tahdheer — Loki 3.x, single-binary, filesystem storage (MIP §11.4).
# Minimal by design; move off-box only when resources demand (MIP §11.3).

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2026-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

limits_config:
  retention_period: 720h # 30d — align with privacy retention posture (§11.2)
  allow_structured_metadata: true # required for OTLP ingestion

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem
