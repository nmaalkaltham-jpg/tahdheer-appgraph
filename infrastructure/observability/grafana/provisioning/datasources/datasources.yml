# Tahdheer — Grafana provisioned datasources (MIP §11.4)
apiVersion: 1

datasources:
  - name: Prometheus
    uid: tahdheer-prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s

  - name: Loki
    uid: tahdheer-loki
    type: loki
    access: proxy
    url: http://loki:3100
    jsonData:
      derivedFields:
        - name: TraceID
          matcherRegex: '"trace_id":"(\w+)"'
          datasourceUid: tahdheer-tempo
          url: "$${__value.raw}"

  - name: Tempo
    uid: tahdheer-tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToLogsV2:
        datasourceUid: tahdheer-loki
      tracesToMetrics:
        datasourceUid: tahdheer-prometheus
