# =============================================================================
# Tahdheer — OpenTelemetry Collector (MIP §11.4)
# OTLP in (apps: Next.js storefront/admin, Laravel api/worker/scheduler,
# RUM web vitals) → Prometheus (metrics) + Loki (logs) + Tempo (traces).
# =============================================================================

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  memory_limiter:
    check_interval: 1s
    limit_mib: 512
    spike_limit_mib: 128
  batch:
    timeout: 5s
    send_batch_size: 1024
  # Drop obvious PII-bearing attributes before export (MIP §11.2: no raw
  # IP/UA persisted). Extend the list as instrumentation lands.
  attributes/privacy:
    actions:
      - key: http.client_ip
        action: delete
      - key: user_agent.original
        action: delete

exporters:
  # Scraped by Prometheus at otel-collector:8889/metrics
  prometheus:
    endpoint: 0.0.0.0:8889
    resource_to_telemetry_conversion:
      enabled: true
  # Loki 3.x native OTLP ingestion (the legacy `loki` exporter is deprecated).
  otlphttp/loki:
    endpoint: http://loki:3100/otlp
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true # internal compose network only

service:
  telemetry:
    metrics:
      readers:
        - pull:
            exporter:
              prometheus:
                host: 0.0.0.0
                port: 8888
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, batch]
      exporters: [prometheus]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, batch]
      exporters: [otlphttp/loki]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/privacy, batch]
      exporters: [otlp/tempo]
