; تجاوز التطوير المحلّي فقط — يُركَّب على صورة الإنتاج بلا تعديلها.
;
; صورة الإنتاج تضبط opcache.validate_timestamps = 0 عمدًا (أسرع، والكود
; ثابت داخل الصورة). لكنّ التطوير المحلّي يصل مجلّد Laravel حيًّا، فيعني
; ذلك أنّ كل تعديل PHP يُتجاهَل بصمت: الملفّ يتغيّر والـAPI يُصيّر القديم.
; Dockerfile يوثّق هذا العلاج بنفسه (backend/laravel/Dockerfile سطر ٥٦).
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
