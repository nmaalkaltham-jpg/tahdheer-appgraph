# واجهة nginx أمام php-fpm للبيئة المحلّية.
#
# مأخوذة من إعداد الإنتاج داخل صورة api-web مع فارقين مقصودين:
#   · لا Traefik ولا TLS محلّيًّا، فلا حاجة لخريطة X-Forwarded-Proto.
#   · الاستماع على 8080 كما في الإنتاج ليبقى المنفذ الداخلي واحدًا.
#
# resolver مُبقًى عمدًا: مع `fastcgi_pass api:9000` حرفيًّا يحلّ nginx الاسم
# مرّة واحدة عند الإقلاع ويخزّن العنوان، فأي إعادة إنشاء لحاوية api تحوّل
# هذه الواجهة إلى 502 دائم حتى تُعاد تشغيلها هي أيضًا. الحلّ لكل طلب
# (valid=10s) يجعلها تنجو من إعادة تشغيل api — وهذا يحدث كثيرًا في التطوير.

# رمز الطلب ومفتاح التنزيل في المسار اعتمادان لا عنوانان: سجلّ الوصول يكتب
# مكانهما `[token]`، ومن المُرجِع أصلَه وحده. مطابقٌ لإعداد api-web في الإنتاج.
map $uri $tahdheer_credential_uri {
    default "";
    "~*^(?<log_order>/api/v1/(?:checkout/)?orders/)[^/]+(?<log_order_rest>.*)$" "${log_order}[token]${log_order_rest}";
    "~*^(?<log_fake>/api/v1/payments/fake/)[^/]+(?<log_fake_rest>.*)$" "${log_fake}[token]${log_fake_rest}";
    "~*^(?<log_redeem>/api/v1/downloads/redeem/)" "${log_redeem}[token]";
}

# Matched on $uri (decoded, slashes merged) so `%2F` or `//` spellings Laravel still routes are caught;
# every other request keeps its raw line.
# A query string can carry the same link (an order URL pasted into search): logged without it.
map $args $tahdheer_args_credential {
    default 0;
    "~*orders(/|%2F|%5C|%25)" 1;
    "~(?<![A-Za-z0-9_-])(?=[A-Za-z0-9_-]*[A-Z])(?=[A-Za-z0-9_-]*[a-z])[A-Za-z0-9_-]{43}(?![A-Za-z0-9_-])" 1;
}

map "$tahdheer_credential_uri|$tahdheer_args_credential" $tahdheer_log_uri {
    "|0"    $request_uri;
    "|1"    "$uri?[redacted]";
    default $tahdheer_credential_uri;
}

map $http_referer $tahdheer_log_referer {
    default "-";
    "~^(?<log_referer>https?://[^/?#]+)" $log_referer;
}

log_format tahdheer_redacted '$remote_addr - $remote_user [$time_local] "$request_method $tahdheer_log_uri $server_protocol" '
                             '$status $body_bytes_sent "$tahdheer_log_referer" "$http_user_agent"';

server {
    listen 8080;
    server_name _;
    access_log /var/log/nginx/access.log tahdheer_redacted;
    server_tokens off;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream api:9000;

    client_max_body_size 64m;

    # حياة الواجهة نفسها، يجيب عنها nginx مباشرةً: إن كان /healthz يعطي 200
    # و/up يعطي 502 فالعطل في php-fpm لا في الواجهة.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain always;
        return 200 "ok\n";
    }

    # أغلفة العرض المحلّية (DesignPreviewSeeder) تُخزَّن على قرص public
    # وتُعنوَن ‎/storage/…‎ — ولم يكن شيء في المكدّس يقدّمها: هذه الواجهة
    # تمرّر كل شيء إلى php-fpm، وLaravel بلا مسار لها فيردّ **403**. فكانت
    # كل صور المنتجات في المتجر المحلّي مكسورة بلا رسالة تشرح السبب.
    # الإنتاج لا يمرّ بهذا المسار أصلًا (أغلفته على ‎/api/v1/media/…‎)،
    # فهذا الفارق محلّيّ محض كسائر فوارق هذا الملفّ.
    location /storage/ {
        alias /var/www/html/storage/app/public/;
        access_log off;
        try_files $uri =404;
    }

    location / {
        include fastcgi_params;
        fastcgi_pass  $api_upstream;
        # مسارات مطلقة كما تُرى داخل حاوية api (working_dir /var/www/html).
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param SCRIPT_NAME     /index.php;
        fastcgi_param PATH_INFO       $uri;
        fastcgi_param QUERY_STRING    $query_string;
        fastcgi_param REQUEST_METHOD  $request_method;
        fastcgi_param CONTENT_TYPE    $content_type;
        fastcgi_param CONTENT_LENGTH  $content_length;
        fastcgi_param REQUEST_URI     $request_uri;
        fastcgi_param DOCUMENT_URI    $document_uri;
        fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
        fastcgi_param SERVER_PROTOCOL $server_protocol;
        fastcgi_param REMOTE_ADDR     $remote_addr;
        fastcgi_param SERVER_NAME     $host;
        fastcgi_read_timeout 120s;

        # error_log cannot be formatted, and an upstream failure writes the raw request line —
        # the order token with it. On credential routes only `crit` is written; the failure
        # still shows in the access log as a 502/504 against `[token]`.
        location ~* ^/api/v1/((checkout/)?orders|payments/fake|downloads/redeem)/ {
            error_log /var/log/nginx/error.log crit;
            fastcgi_pass $api_upstream;
        }
    }
}
