# =============================================================================
# Tahdheer Digital Commerce OS — Docker Compose (MIP §2.1, §11.3)
# =============================================================================
# One strong VPS + Docker Compose. NO Kubernetes initially (k3s only on
# measured need). Observability services carry the `observability` profile so
# the core stack runs standalone.
#
# storefront / admin / api / worker / scheduler are REAL builds from this
# monorepo. All three Dockerfiles take the repo ROOT as their context, because
# the Next.js apps consume npm-workspace packages in packages/* — hence
# `context: ../..` everywhere. worker and scheduler deliberately reuse the api
# image (identical build → resolved from the BuildKit cache, not rebuilt).
#
# Profiles:
#   (none)          → core: caddy, postgres, valkey, meilisearch, garage
#   apps            → storefront, admin, api, worker, scheduler
#   observability   → otel-collector, prometheus, loki, tempo, grafana
#
# Usage:
#   docker compose --env-file .env up -d                         # core only
#   docker compose --profile apps up -d --build                  # + apps
#   docker compose --profile apps --profile observability up -d  # everything
#
# Migrations are NOT run by any container (N replicas would race). Once, by hand:
#   docker compose run --rm api php artisan migrate --force
#
# DEPLOYING BESIDE THE EXISTING TRAEFIK (VPS 186.241.18.59): this file alone
# starts Caddy, which would fight n8n's Traefik for ports 80/443. Always add the
# override, which neutralizes Caddy and attaches the apps to Traefik's network:
#   docker compose -f docker-compose.yml -f docker-compose.traefik.yml \
#     --env-file .env --env-file .env.traefik --profile apps up -d
# TRAEFIK_NETWORK / TRAEFIK_ENTRYPOINT / TRAEFIK_CERTRESOLVER are unknown until
# discovered on that server — see docker-compose.traefik.yml and the runbook
# ../../docs/deployment/VPS-TRAEFIK.md §2.
#
# ALL secrets come from .env (see .env.example) — never inline here.
# =============================================================================

name: tahdheer

networks:
  tahdheer:
    driver: bridge

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
  valkey_data:
  meili_data:
  garage_meta:
  garage_data:
  prometheus_data:
  loki_data:
  tempo_data:
  grafana_data:

services:
  # ---------------------------------------------------------------------------
  # Edge: Caddy 2.x — TLS, HTTP/2/3, compression, security headers, request
  # limits, health routing. NO business authorization in Caddy (MIP §11.3).
  # ---------------------------------------------------------------------------
  caddy:
    # MIP targets Caddy 2.11.4 — pin the exact patch tag once verified in staging.
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp" # HTTP/3 (QUIC)
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ../caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [tahdheer]

  # ---------------------------------------------------------------------------
  # Apps (profile: apps) — placeholder commands until Dockerfiles exist.
  # ---------------------------------------------------------------------------
  storefront:
    # Next.js 16 standalone on Node.js 24 (MIP §2.1). The context is the
    # monorepo ROOT because the app transpiles ../../packages/* workspace deps.
    # No `working_dir` / `command` here on purpose: the image already sets
    # WORKDIR /app/apps/storefront and CMD ["node","server.js"], which is where
    # the standalone output actually lands. Overriding working_dir would break
    # the server entry.
    build:
      context: ../..
      dockerfile: apps/storefront/Dockerfile
      args:
        # يجب أن يطابق ADMIN_URL أدناه: الصفحات المُصيَّرة مسبقًا تأخذ قيمة
        # البناء، والمسارات الديناميكية تأخذ قيمة التشغيل. اختلافهما يعني
        # رابطًا يظهر في صفحة ويختفي في أخرى.
        ADMIN_URL: https://admin.${DOMAIN}
        # NEXT_PUBLIC_* تُخبز في حزم المتصفّح وقت البناء. غيابها هنا — لا في
        # environment أدناه — هو ما كسر السلة وأفرغ خريطة الموقع.
        NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
        NEXT_PUBLIC_SITE_URL: https://store.${DOMAIN}
        NEXT_PUBLIC_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
        NEXT_PUBLIC_WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-}
    image: tahdheer/storefront:${TAHDHEER_TAG:-local}
    profiles: [apps]
    restart: unless-stopped
    environment:
      # نداءات الخادم (الوسيط) تمرّ داخل الشبكة؛ NEXT_PUBLIC_* للمتصفّح.
      INTERNAL_API_URL: http://api-web:8080
      NODE_ENV: production
      PORT: "3000"
      # تُكرَّر هنا لمكوّنات الخادم التي تقرأها وقت الطلب. يجب أن تطابق
      # وسائط البناء أعلاه حرفيًّا: اختلافهما يعني متجرًا يطلب عنوانًا من
      # المتصفّح وآخر من الخادم.
      NEXT_PUBLIC_API_URL: https://api.${DOMAIN}
      # ─── مضيف المتجر `store.` لا القمّة المجرّدة ───
      #
      # الحافّة في هذا المِلَفّ هي Caddy، و`infrastructure/caddy/Caddyfile`
      # يعرّف ثلاثة مضيفات: `store.` و`admin.` و`api.` — **ولا كتلة للقمّة**.
      # وكانت هذه المتغيّرات تشير إلى `https://${DOMAIN}` المجرّدة، أي إلى
      # مضيفٍ لا يخدمه شيء. والأثر ثلاثيّ وصامت:
      #
      #   · الرابط المعياريّ وخريطة الموقع و‎@id‎ في البيانات المُهيكلة تشير
      #     كلّها إلى عنوانٍ لا يُجيب — وهو العطب الذي يشرحه `config/seo.php`
      #     بنصّه: متجرٌ يخبر محرّكات البحث أنّ نسخته المعياريّة في مكانٍ لا
      #     صفحات فيه.
      #   · `FRONTEND_URL` هو الأصل الوحيد المسموح في `config/cors.php`،
      #     فالمتصفّح يأتي من `store.` ويُسمح للقمّة — فيُردّ كلّ نداء.
      #   · ولا خطأ يُرفع في أيٍّ من ذلك.
      #
      # وطبقة Traefik تصحّح هذا عندها بـ`STORE_HOST`؛ وهذا المِلَفّ وحده كان
      # يبقى على القمّة. من أراد تقديم القمّة يضيف كتلةً في Caddyfile تحوّلها
      # إلى `store.` — ولا يُغيَّر العنوان هنا وحده.
      NEXT_PUBLIC_SITE_URL: https://store.${DOMAIN}
      NEXT_PUBLIC_SUPPORT_EMAIL: ${SUPPORT_EMAIL:-}
      NEXT_PUBLIC_WHATSAPP_NUMBER: ${WHATSAPP_NUMBER:-}
      # الطرف المستقبِل لإبطال المخزن. يجب أن يطابق
      # `STOREFRONT_REVALIDATE_SECRET` في مرساة Laravel حرفيًّا: اختلافهما
      # يُرَدّ ٤٠١، وفراغُه هنا يُرَدّ ٥٠٣ — والخلفيّة ترى الرفض ولا يراه أحد.
      REVALIDATE_SECRET: ${STOREFRONT_REVALIDATE_SECRET}
      # جسر المتجر → اللوحة (تذييل الصفحة). أفرغه ليختفي الرابط من المتجر العام.
      ADMIN_URL: https://admin.${DOMAIN}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    networks: [tahdheer]

  admin:
    # لوحة التشغيل (Next.js 16). كانت غائبةً عن هذا الملفّ بينما يشير إليها
    # Caddyfile بـ`admin:3000` ويفترضها تراكبُ Traefik — فكان النشر الأوّل
    # يردّ ٥٠٢ على النطاق الفرعيّ، والثاني يفشل في التحقّق أصلًا بـ
    # «service "admin" has neither an image nor a build context».
    #
    # السياق جذر المستودع لأنّ اللوحة تترجم حزم `packages/*` نفسها كالمتجر.
    build:
      context: ../..
      dockerfile: apps/admin/Dockerfile
      args:
        # يجب أن يطابق STOREFRONT_URL أدناه: صفحات اللوحة تُصيَّر مسبقًا،
        # فقيمة التشغيل وحدها لا تصل إلى HTML المُخبوز.
        # و`store.` لا القمّة — للسبب المشروح على خدمة المتجر: القمّة بلا كتلة
        # في Caddyfile، فرابط «عايِنْ في المتجر» كان يقود إلى مضيفٍ لا يُجيب.
        STOREFRONT_URL: https://store.${DOMAIN}
    image: tahdheer/admin:${TAHDHEER_TAG:-local}
    profiles: [apps]
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      # وسيط اللوحة يعمل في الخادم ويبلغ Laravel عبر جسر HTTP→FastCGI
      # الداخليّ، لا عبر localhost ولا عبر الحافة.
      ADMIN_API_URL: http://api-web:8080
      STOREFRONT_URL: https://store.${DOMAIN}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    depends_on:
      api-web:
        condition: service_healthy
    networks: [tahdheer]

  api-web:
    image: nginx:1.27-alpine
    profiles: [apps]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "8080" # documentation only; not published to the host
    command:
      - sh
      - -euc
      - |
        cat > /etc/nginx/conf.d/default.conf <<'NGINX'
        # Traefik terminates TLS and forwards X-Forwarded-Proto. Turning that
        # into $$_SERVER['HTTPS'] is what makes Laravel emit https:// URLs.
        map $$http_x_forwarded_proto $$fcgi_https {
            default "";
            https   on;
        }

        # Order tokens and download grants in the path are credentials, not
        # addresses: the access log writes [token] in their place, and only the
        # referrer's origin. Mirrors infrastructure/docker/local-nginx.conf.
        map $$uri $$tahdheer_credential_uri {
            default "";
            "~*^(?<log_order>/api/v1/(?:checkout/)?orders/)[^/]+(?<log_order_rest>.*)$$" "$${log_order}[token]$${log_order_rest}";
            "~*^(?<log_fake>/api/v1/payments/fake/)[^/]+(?<log_fake_rest>.*)$$" "$${log_fake}[token]$${log_fake_rest}";
            "~*^(?<log_redeem>/api/v1/downloads/redeem/)" "$${log_redeem}[token]";
        }

        # Matched on $$uri (decoded, slashes merged) so `%2F` or `//` spellings Laravel still routes are caught;
        # every other request keeps its raw line.
        # A query string can carry the same link (an order URL pasted into search): logged without it.
        map $$args $$tahdheer_args_credential {
            default 0;
            "~*orders(/|%2F|%5C|%25)" 1;
            "~(?<![A-Za-z0-9_-])(?=[A-Za-z0-9_-]*[A-Z])(?=[A-Za-z0-9_-]*[a-z])[A-Za-z0-9_-]{43}(?![A-Za-z0-9_-])" 1;
        }

        map "$$tahdheer_credential_uri|$$tahdheer_args_credential" $$tahdheer_log_uri {
            "|0"    $$request_uri;
            "|1"    "$$uri?[redacted]";
            default $$tahdheer_credential_uri;
        }

        map $$http_referer $$tahdheer_log_referer {
            default "-";
            "~^(?<log_referer>https?://[^/?#]+)" $$log_referer;
        }

        log_format tahdheer_redacted '$$remote_addr - $$remote_user [$$time_local] "$$request_method $$tahdheer_log_uri $$server_protocol" '
                                     '$$status $$body_bytes_sent "$$tahdheer_log_referer" "$$http_user_agent"';

        server {
            listen 8080;
            server_name _;
            server_tokens off;
            access_log /var/log/nginx/access.log tahdheer_redacted;

            # Docker's embedded DNS. Required because the upstream below is a
            # VARIABLE: with a literal `fastcgi_pass api:9000` nginx resolves
            # the name once at startup and caches that IP forever, so every
            # `up -d`/recreate of the api container turns this sidecar into a
            # permanent 502 until it is restarted too. Re-resolving per request
            # (valid=10s) makes the sidecar survive api restarts, and lets it
            # boot even while api is still starting.
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $$api_upstream api:9000;

            # Mirrors the Caddyfile api limit; the app re-validates uploads.
            client_max_body_size 64m;

            # Sidecar liveness, answered by nginx itself. If /healthz is 200 but
            # /up is 502, the fault is php-fpm, not the sidecar or Traefik.
            location = /healthz {
                access_log off;
                add_header Content-Type text/plain always;
                return 200 "ok\n";
            }

            location / {
                include fastcgi_params;
                fastcgi_pass  $$api_upstream;
                # Absolute paths as seen INSIDE the api container
                # (working_dir /var/www/html).
                fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
                fastcgi_param SCRIPT_NAME     /index.php;
                fastcgi_param DOCUMENT_ROOT   /var/www/html/public;
                fastcgi_param HTTPS           $$fcgi_https;
                fastcgi_read_timeout 60s;
                fastcgi_buffer_size  32k;
                fastcgi_buffers      16 16k;

                # error_log cannot be formatted, and an upstream failure writes the raw
                # request line — the order token with it. On credential routes only `crit`
                # is written; the failure still shows in the access log as 502/504 on [token].
                location ~* ^/api/v1/((checkout/)?orders|payments/fake|downloads/redeem)/ {
                    error_log /var/log/nginx/error.log crit;
                    fastcgi_pass $$api_upstream;
                }
            }
        }
        NGINX
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [tahdheer]


  api:
    # PHP 8.5 FPM (MIP §2.1: PHP 8.5.10). Octane + FrankenPHP only AFTER a
    # measured baseline justifies it (throughput, p50/p95/p99, CPU, memory,
    # worker stability + static-state/singleton/request-scope audit) — then
    # switch this image to dunglas/frankenphp and Caddy from php_fastcgi to
    # reverse_proxy.
    # The image bakes the Laravel app + vendor/ and runs php-fpm on :9000. Its
    # entrypoint builds config/route/view caches at START (never at build time,
    # where no env exists) and then execs php-fpm. WORKDIR and CMD come from the
    # image, so neither is repeated here.
    build: &api-build
      context: ../.. # monorepo root — same context as the Next.js images
      dockerfile: backend/laravel/Dockerfile
    image: tahdheer/api:${TAHDHEER_TAG:-local}
    profiles: [apps]
    restart: unless-stopped
    environment: &laravel-env
      APP_ENV: ${APP_ENV}
      APP_KEY: ${APP_KEY}
      APP_URL: https://api.${DOMAIN}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: tahdheer
      DB_USERNAME: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: valkey # Laravel redis driver — Valkey is wire-compatible
      REDIS_PASSWORD: ${VALKEY_PASSWORD}
      REDIS_PORT: "6379"
      CACHE_STORE: redis
      QUEUE_CONNECTION: redis
      # السجلّ إلى stderr بصيغة JSON: كان يُكتب في ملفٍّ داخل الحاوية ويضيع
      # مع إعادة تشغيلها — فلا يصل خطأُ خطّافٍ أو موتُ حدثٍ إلى أيّ جامع.
      LOG_CHANNEL: stderr
      LOG_STDERR_FORMATTER: Monolog\Formatter\JsonFormatter
      # الراية نفسها للخادم والعامل — انظر التعليق في ملفّ التطوير.
      AI_ENABLED: ${AI_ENABLED:-false}
      AI_BASE_URL: ${AI_BASE_URL:-http://ai-llm:8081}
      SESSION_DRIVER: redis
      MEILISEARCH_HOST: http://meilisearch:7700
      MEILISEARCH_KEY: ${MEILI_MASTER_KEY}
      # pg هو الافتراضي الآمن؛ يُرفع إلى meilisearch بعد أوّل بناء ناجح للفهرس.
      SEARCH_PROVIDER: ${SEARCH_PROVIDER:-pg}
      AWS_ENDPOINT: http://garage:3900 # Garage S3 API
      AWS_ACCESS_KEY_ID: ${GARAGE_S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${GARAGE_S3_SECRET_KEY}
      AWS_DEFAULT_REGION: garage
      AWS_USE_PATH_STYLE_ENDPOINT: "true"
      # الدلو لم يكن مضبوطًا إطلاقًا، فكل تحميل منتج مدفوع يفشل عند الطلب.
      AWS_BUCKET: ${GARAGE_BUCKET:-tahdheer}
      FILESYSTEM_DISK: ${FILESYSTEM_DISK:-garage}
      ASSETS_STORAGE_PROVIDER: ${ASSETS_STORAGE_PROVIDER:-garage}

      # أصل المتجر — تقرؤه config/cors.php لبناء allowed_origins. و`store.`
      # لأنّها المضيف الذي يخدمه Caddy فعلًا: القمّة بلا كتلة، فالسماح لها
      # يعني ردّ كلّ نداءٍ يأتي من المتصفّح (التعليل كاملًا على خدمة المتجر).
      FRONTEND_URL: https://store.${DOMAIN}

      # ─── إبطال مخزن المتجر: الحلقة الأخيرة في سلسلة العناوين ───
      #
      # `RevalidateStorefrontJob` يقرأ هذين من `config/url.php`، وفراغُ أيّهما
      # يجعله يعود صامتًا («storefront revalidation not configured») — فيبقى
      # المسار المُعاد تسميته مخزَّنًا في المتجر حتى تنقضي نافذة الستّين
      # ثانية. والصورة **خالية من `.env` بالتصميم** (backend/laravel/Dockerfile)
      # فلا مصدر لهما إلّا هذه الكتلة. العنوان داخليّ على شبكة tahdheer:
      # المتجر يستمع على 3000 ولا يخرج النداء إلى الإنترنت.
      STOREFRONT_REVALIDATE_URL: ${STOREFRONT_REVALIDATE_URL:-http://storefront:3000/api/revalidate}
      STOREFRONT_REVALIDATE_SECRET: ${STOREFRONT_REVALIDATE_SECRET}
      # أصل المتجر العامّ لنطاق SEO. صراحةً لا استنتاجًا: سقوطه على APP_URL
      # (مضيف الـAPI) جعل كل رابط معياري في المتجر يشير إلى مضيف يخدم JSON.
      SEO_SITE_URL: ${SEO_SITE_URL:-https://store.${DOMAIN}}

      # بوّابة الدفع. تُقرأ وقت بناء الإعداد (config/services.php) فتنجو من
      # config:cache — قراءتها بـ env() وقت الطلب كانت تعطي null في الإنتاج
      # فتُرفض كل إشعارات الدفع الواردة ولا يُموَّل طلب.
      PAYMENTS_PROVIDER: ${PAYMENTS_PROVIDER:-tap}
      TAP_BASE_URL: ${TAP_BASE_URL:-https://api.tap.company/v2}
      # عقد البيئة (TapCredentials): وضعٌ واحد ومفاتيحُه — الخلط يُسقط الإقلاع.
      TAP_MODE: ${TAP_MODE:-live}
      TAP_MERCHANT_ID: ${TAP_MERCHANT_ID:-68052232}
      # لا مفاتيح تجربة في الإنتاج: خانتُها غير ممرَّرة أصلًا، والإقلاع يرفضها إن وُجدت.
      TAP_LIVE_SECRET_KEY: ${TAP_LIVE_SECRET_KEY:-}
      TAP_LIVE_PUBLIC_KEY: ${TAP_LIVE_PUBLIC_KEY:-}
      # قديم — يُقبل فقط حين تطابق بادئتُه TAP_MODE.
      TAP_SECRET_KEY: ${TAP_SECRET_KEY:-}
      TAP_WEBHOOK_SECRET: ${TAP_WEBHOOK_SECRET:-}
      # Apple Pay عبر Tap: يُفعَّل فقط بعد تأكيد تفعيله في حساب البوّابة —
      # فزرّ Apple Pay في المتجر يُقرأ من GET /api/v1/checkout/methods لا من الشيفرة.
      TAP_APPLE_PAY: ${TAP_APPLE_PAY:-false}

      # الوكلاء الموثوقون. الفراغ يعني النطاقات الخاصّة الافتراضية، وهي
      # الصحيحة خلف Traefik داخل شبكة Docker.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}

      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT}
    # No `healthcheck:` block — it is INHERITED from the image, which speaks real
    # FastCGI to the pool's ping.path (`cgi-fcgi -bind -connect 127.0.0.1:9000`,
    # expecting "pong"). That is strictly stronger than the TCP-connect probe
    # this line used to be, and keeping one definition stops the two drifting.
    # (`api-web` in docker-compose.traefik.yml waits on it via service_healthy.)
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    networks: [tahdheer]

  worker:
    # Queue consumers + transactional-outbox publisher (MIP §4.10, §11.8).
    # Same image as `api` — the build is byte-identical, so BuildKit resolves it
    # from cache instead of rebuilding.
    # Runs both processes in one container; production should split them (scale
    # `worker` replicas / add an `outbox` service) or supervise via Horizon after
    # Valkey-compat verification.
    build: *api-build
    image: tahdheer/api:${TAHDHEER_TAG:-local}
    profiles: [apps]
    restart: unless-stopped
    # `outbox:process` is a SINGLE-PASS command (`{--limit=50 : Max rows per
    # poll}` — it drains one batch and exits), so it needs a pulse. It is now
    # ALSO registered on the Laravel scheduler (routes/console.php,
    # `->everyMinute()->withoutOverlapping(5)`), which the `scheduler` service
    # runs — but a minute of latency is a minute of stale storefront cache and
    # stale search index. This 5s loop is the fast path; the scheduler entry is
    # the backstop that keeps publishing if this container is down.
    #
    # Running both is SAFE, not duplicated work: `OutboxProcessor::process`
    # claims rows inside a transaction with `FOR UPDATE SKIP LOCKED`, so a
    # second poller skips what the first holds and no consumer runs twice.
    # `|| true` keeps one bad batch from killing the publisher.
    command:
      - sh
      - -c
      - "while :; do php artisan outbox:process --limit=100 || true; sleep 5; done & exec php artisan queue:work --queue=default,search-index,crawler,ai --tries=3 --backoff=10 --max-time=3600"
    # The image's HEALTHCHECK pings php-fpm, which does not run here — without
    # this the container would report `unhealthy` forever. Worker liveness is
    # covered by `restart: unless-stopped` (queue:work exits on --max-time and is
    # restarted with fresh memory, which is the intended pattern).
    healthcheck:
      disable: true
    environment: *laravel-env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks: [tahdheer]

  scheduler:
    # Same built image as `api`; only the command differs. Exactly ONE replica —
    # a second scheduler would double-run every due task.
    build: *api-build
    image: tahdheer/api:${TAHDHEER_TAG:-local}
    profiles: [apps]
    restart: unless-stopped
    command: ["php", "artisan", "schedule:work"]
    # No php-fpm in this container — see the note on `worker`.
    healthcheck:
      disable: true
    environment: *laravel-env
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks: [tahdheer]

  # ---------------------------------------------------------------------------
  # Data plane
  # ---------------------------------------------------------------------------
  postgres:
    # MIP §2.1: PostgreSQL 18.x — sole source of durable truth.
    # Fallback: if the `postgres:18` tag is unavailable on your registry
    # mirror, use `postgres:17` temporarily and record the deviation.
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: tahdheer
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # pgBackRest archiving is configured on the host / sidecar — see
      # ../postgres/pgbackrest/pgbackrest.conf and ../../backups/README.md
    volumes:
      # MUST be /var/lib/postgresql, NOT /var/lib/postgresql/data. The 18+
      # images store data in a major-version subdirectory
      # (/var/lib/postgresql/18/docker) so `pg_upgrade --link` never has to cross
      # a mount boundary. Mounting the old .../data path makes the entrypoint
      # abort with "PostgreSQL data in /var/lib/postgresql/data (unused
      # mount/volume)" and the container restart-loops — verified locally.
      # See docker-library/postgres#1259.
      - postgres_data:/var/lib/postgresql
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    # ports: ["127.0.0.1:5432:5432"]  # uncomment for local debugging only
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d tahdheer"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [tahdheer]

  valkey:
    # MIP §2.1: Valkey 9.x — cache/sessions/locks/queues. NEVER authoritative
    # for orders/payments/entitlements/products.
    # Fallback: `valkey/valkey:8` if the :9 tag is unavailable.
    image: valkey/valkey:9
    restart: unless-stopped
    command:
      - sh
      - -c
      - exec valkey-server --requirepass "$$VALKEY_PASSWORD" --appendonly no --maxmemory-policy noeviction
    environment:
      VALKEY_PASSWORD: ${VALKEY_PASSWORD}
    volumes:
      - valkey_data:/data
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli --no-auth-warning -a \"$$VALKEY_PASSWORD\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [tahdheer]

  meilisearch:
    # MIP §2.1 targets Meilisearch 1.5x CE. Pin the exact v1.x.y tag verified
    # in staging before production (index dumps are version-coupled).
    image: getmeili/meilisearch:v1.15
    restart: unless-stopped
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_ENV: production
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --spider http://127.0.0.1:7700/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [tahdheer]

  # ---------------------------------------------------------------------------
  # محرّك الاستدلال المحلّيّ — llama.cpp يخدم Qwen3.5-2B بتكميم Q4_K_M.
  #
  # ─── لماذا خدمةٌ معزولة لا مكتبةٌ داخل PHP ───
  #
  # الاستدلال يحجز ذاكرةً ويشغّل أنويةً لثوانٍ. وتشغيلُه داخل عامل الطابور كان
  # يجعل نفاد ذاكرته يقتل العامل نفسه، فتتوقّف الفهرسة وصندوق الصادر معه.
  # العزل يجعل انهيار النموذج حدثًا في خدمةٍ واحدة تُعاد وحدها.
  #
  # ─── ولماذا لا `ports` ───
  #
  # لا منفذ منشور. llama.cpp لا مصادقة فيه ولا تحديد معدّل، وكشفُه يعني نموذجًا
  # مفتوحًا للإنترنت يستنزف الخادم بطلبٍ واحد. الوصول من شبكة Docker وحدها،
  # وعبر بوّابة Laravel حصرًا.
  #
  # ─── حدود الموارد ───
  #
  # المتجر أولى بالموارد من الذكاء. ثلاثة أنوية من خمسة، وثلاثة غيغابايت سقفًا
  # صلبًا: تجاوزُها يقتل الحاوية ويعيدها، ولا يلتهم ذاكرة PostgreSQL. وطلبٌ
  # متوازٍ واحد: التوازي على معالجٍ بلا مسرّع يضاعف الزمن ولا يضاعف الإنتاجيّة.
  # ---------------------------------------------------------------------------
  ai-llm:
    image: ghcr.io/ggml-org/llama.cpp:server
    restart: unless-stopped
    # القراءة فقط: الخدمة لا تكتب في الأوزان، وتثبيتُها يمنع تلفًا عرضيًّا.
    volumes:
      - ../ai/models:/models:ro
    command:
      - --model
      - /models/${AI_MODEL_FILE:-Qwen3.5-2B-Q4_K_M.gguf}
      - --host
      - 0.0.0.0
      - --port
      - "8081"
      # `-ngl 0` تصريحٌ لا افتراض: بناءُ الصورة قد يحوي دعم مسرّع، وتركُ القيمة
      # للافتراض يجعل السلوك يختلف بين مضيفٍ وآخر.
      - --n-gpu-layers
      - "0"
      - --threads
      - "${AI_CPU_THREADS:-3}"
      - --ctx-size
      - "${AI_CONTEXT:-4096}"
      - --parallel
      - "${AI_PARALLEL_REQUESTS:-1}"
      # دفعةٌ صغيرة: الدفعة الكبيرة تحجز ذاكرةً مؤقّتةً تتجاوز السقف عند أوّل
      # مدخلٍ طويل، فتُقتل الحاوية في منتصف طلب.
      - --batch-size
      - "256"
      - --ubatch-size
      - "128"
      # طابور الخدمة نفسها محدود: ما يتجاوزه يُرَدّ فورًا بدل أن يتراكم في
      # الذاكرة. الضغط العكسيّ يبدأ هنا لا في PHP وحدها.
      - --threads-http
      - "2"
      # لا واجهة ويب: سطحٌ زائد في خدمةٍ بلا مصادقة.
      - --no-webui
      # مقاييس Prometheus على /metrics — يلتقطها الملتقط القائم.
      - --metrics
    environment:
      LLAMA_ARG_NO_WARMUP: "0"
    healthcheck:
      # `/health` يردّ ٢٠٠ بعد تحميل الأوزان فقط. ومهلة البدء طويلة عمدًا:
      # تحميل ١٫٢٨ غيغابايت من قرصٍ بطيء يتجاوز الدقيقة، وفحصٌ متعجّل كان
      # يُعلن الخدمة فاشلةً ويعيدها في حلقةٍ لا تنتهي.
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 180s
    # إنهاءٌ مهذّب: الطلب الجاري يُكمَل قبل الإغلاق بدل قطعه في منتصفه.
    stop_grace_period: 30s
    # ─── السقف يعمل، وهو ليس زينة ───
    #
    # قيس هذا على تسعين استدلالًا متتاليًا: الذاكرة غير القابلة للاسترجاع تنمو
    # من ١٫٣٤ غيغابايت عند الإقلاع إلى نحو ٢٫٩ ثمّ تتذبذب دونه ولا تتجاوزه،
    # ولم تُقتل الحاوية مرّةً واحدة. فهذا ليس تسرّبًا بل مجموعُ عملٍ مستقرّ
    # يبلغه المخصِّص، والسقف هو ما يُجبره على إعادة الاستعمال بدل طلب المزيد.
    #
    # وجُرّب خفضُه بتكميم ذاكرة KV وبتحديد ساحات malloc: منحنى النموّ نفسه في
    # الحالات الثلاث. فأُزيلا بدل شحن ضبطٍ لا أثر له.
    #
    # النتيجة العمليّة: ثلاثة غيغابايت هي مجموع العمل لا سقفٌ فوقه هامش. ورفعُ
    # `AI_CONTEXT` فوق ٤٠٩٦ يستلزم رفع هذا السقف معه.
    mem_limit: ${AI_MEMORY_LIMIT:-3g}
    # حجزٌ أدنى لا يُنتزع: بلا حدٍّ أدنى قد يُزاح النموذج إلى التبديل فيصير
    # كلّ استدلالٍ دقائق.
    mem_reservation: 1g
    cpus: "${AI_CPU_LIMIT:-3.0}"
    # أولويّة أدنى من المتجر: عند تزاحم المعالج يتنازل الذكاء لا قاعدة البيانات.
    cpu_shares: 512
    networks: [tahdheer]

  garage:
    # MIP §2.1: Garage 2.x S3-compatible object storage. Pin the exact v2.x.y
    # tag verified in staging. SeaweedFS only at measured scale (FUTURE).
    image: dxflrs/garage:v2.0.0
    restart: unless-stopped
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN}
    volumes:
      - ../garage/garage.toml:/etc/garage.toml:ro
      - garage_meta:/var/lib/garage/meta
      - garage_data:/var/lib/garage/data
    networks: [tahdheer]

  # ---------------------------------------------------------------------------
  # Observability (profile: observability) — OTel Collector → Prometheus +
  # Loki + Tempo + Grafana (MIP §11.4). May move to secondary infra later.
  #
  # ─── ما يصل هذه الطبقة اليوم: لا شيء من التطبيقات ───
  #
  # `OTEL_EXPORTER_OTLP_ENDPOINT` يُمرَّر إلى المتجر واللوحة وواجهة Laravel،
  # ولا **مُصدِّر** في أيٍّ منها: لا حزمة OpenTelemetry في `composer.json`
  # ولا في `package.json` لأيّ تطبيق. فالمجمِّع يعمل ولا يستقبل أثرًا واحدًا،
  # ولوحات Grafana تُقرأ خاويةً فيُظنّ أنّ النظام ساكن.
  #
  # وُثّق هنا لا حُذف: البنية صحيحة ومقصودة، والناقص هو التجهيز في التطبيقات
  # (‏`@opentelemetry/sdk-node` للواجهتين، وامتداد OTel أو مُصدِّر يدويّ
  # لـPHP). ورفعُ الطبقة قبل ذلك مفيدٌ للسجلّات والمقاييس التي تُكشط مباشرةً
  # — لا للآثار.
  # ---------------------------------------------------------------------------
  otel-collector:
    # Pin the exact release verified in staging (config schema moves between
    # collector minors).
    image: otel/opentelemetry-collector-contrib:0.116.1
    profiles: [observability]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ../observability/otel-collector-config.yaml:/etc/otelcol/config.yaml:ro
    networks: [tahdheer]

  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: [observability]
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=30d
    volumes:
      - ../observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../observability/alerts:/etc/prometheus/alerts:ro
      - prometheus_data:/prometheus
    networks: [tahdheer]

  loki:
    image: grafana/loki:3.3.2
    profiles: [observability]
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ../observability/loki-config.yaml:/etc/loki/loki.yaml:ro
      - loki_data:/loki
    networks: [tahdheer]

  tempo:
    image: grafana/tempo:2.7.0
    profiles: [observability]
    restart: unless-stopped
    command: ["-config.file=/etc/tempo/tempo.yaml"]
    volumes:
      - ../observability/tempo-config.yaml:/etc/tempo/tempo.yaml:ro
      - tempo_data:/var/tempo
    networks: [tahdheer]

  grafana:
    image: grafana/grafana:11.4.0
    profiles: [observability]
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - ../observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    # Loopback-only publish; reach it via SSH tunnel. Do NOT expose publicly
    # without putting it behind Caddy + auth.
    ports:
      - "127.0.0.1:3001:3000"
    networks: [tahdheer]
