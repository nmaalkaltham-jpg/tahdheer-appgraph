<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section dir="rtl" style="padding:16px 18px;border:1px solid rgba(37,155,111,.28);border-radius:12px;background:rgba(37,155,111,.04);font-family:Tajawal,'SF Arabic','Segoe UI',Tahoma,Arial,sans-serif">

<div style="display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:4px">
<h2 style="margin:0;flex:1;min-width:0;font-size:14px;font-weight:900;color:#14261d;text-align:start">المنتج الأصل — مصدر واحد للحقيقة</h2>
<span style="display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:7px;background:#fff;border:1px solid rgba(37,155,111,.3);font-size:10px;font-weight:900;color:#1e7355;white-space:nowrap">{{ filledCount }} من 8 مكتملة</span>
</div>
<p style="display:{{ helpDisplay }};margin:0 0 13px;font-size:11px;line-height:1.7;color:#3b4d43;text-align:start">تُدخل المنتج مرّة. كل فرع أدناه يُقرأ من مكانه الحقيقي في القالب — وملفّات اللغات ترث منه ولا تنسخه.</p>

<div style="display:flex;align-items:stretch;gap:0">
<div style="flex:0 0 auto;width:150px;display:flex;flex-direction:column;justify-content:center;padding:14px 13px;border-radius:11px;background:linear-gradient(150deg,#123d2f,#1e7355);color:#fff">
<span aria-hidden="true" style="display:grid;place-items:center;width:30px;height:30px;border-radius:8px;background:rgba(255,255,255,.16);margin-bottom:9px"><svg style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2"><use href="#i-layers"></use></svg></span>
<b style="display:block;font-size:12.5px;font-weight:900;line-height:1.45;margin-bottom:3px">المنتج الأصل</b>
<span dir="auto" style="display:block;font-size:10px;line-height:1.6;color:rgba(255,255,255,.72);text-align:start">{{ productName }}</span>
</div>

<div aria-hidden="true" style="flex:0 0 auto;width:22px;display:flex;align-items:center;justify-content:center">
<span style="display:block;width:100%;height:2px;background:rgba(37,155,111,.3)"></span>
</div>

<div style="flex:1;min-width:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px">
<sc-for list="{{ branches }}" as="b" hint-placeholder-count="8">
<div style="display:flex;align-items:center;gap:9px;padding:9px 10px;border:1px solid {{ b.border }};border-radius:9px;background:{{ b.bg }}">
<span aria-hidden="true" style="flex:0 0 auto;width:22px;height:22px;border-radius:6px;background:{{ b.dotBg }};color:{{ b.dotFg }};display:grid;place-items:center;font:900 9.5px ui-monospace,monospace">{{ b.mark }}</span>
<span style="flex:1;min-width:0">
<b dir="rtl" style="display:block;font-size:11px;font-weight:900;color:#14261d;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ b.label }}</b>
<code dir="{{ b.srcDir }}" style="display:block;font:600 8.5px ui-monospace,Menlo,monospace;color:#3b4d43;text-align:start;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ b.source }}</code>
</span>
<span style="flex:0 0 auto;box-sizing:border-box;padding:2px 7px;border-radius:5px;background:{{ b.stateBg }};font-size:8.5px;font-weight:900;color:{{ b.stateFg }};white-space:nowrap">{{ b.state }}</span>
</div>
</sc-for>
</div>
</div>

<div style="display:flex;align-items:center;gap:10px;margin-top:11px;padding:10px 12px;border-radius:10px;background:#fff;border:1px dashed rgba(37,155,111,.32)">
<svg aria-hidden="true" style="flex:0 0 auto;width:15px;height:15px;color:#1e7355;fill:none;stroke:currentColor;stroke-width:2.2"><use href="#i-globe"></use></svg>
<span dir="rtl" style="flex:1;min-width:0;font-size:11px;line-height:1.7;color:#3b4d43;text-align:start">{{ inheritNote }}</span>
<span style="flex:0 0 auto;box-sizing:border-box;padding:3px 9px;border-radius:6px;background:rgba(163,58,45,.08);border:1px solid rgba(163,58,45,.2);font-size:9.5px;font-weight:900;color:#a33a2d;white-space:nowrap">تخطيط لا نشر</span>
</div>

</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:860,&quot;height&quot;:300},&quot;help&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;productName&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;عرض بوربوينت — الكيمياء العضوية&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  renderVals() {
    /*
     * Every branch names WHERE the value already lives. A branch is 'ناقص' only
     * when the field genuinely has no value — not when it merely lacks a studio UI.
     */
    const defs = [
      ['الحقائق الموثّقة', '_tahdheer_slides_count …', true, 'مكتملة'],
      ['بيانات WooCommerce', 'WC_Product · price · sku', true, 'مكتملة'],
      ['التصنيف التعليمي', 'curriculum/register.php', true, 'مكتملة'],
      ['المحتوى الأساسي', 'post_content · excerpt', true, 'مكتملة'],
      ['نيّة البحث', '_tahdheer_intent_*', false, 'ناقصة'],
      ['الوسائط', 'thumbnail · gallery', false, 'جزئية'],
      ['مصدر Schema', 'product-education-schema', true, 'مكتملة'],
      ['ملفّات اللغات', '_tahdheer_locale_profiles', false, 'مسودّة']
    ];

    const STATE = {
      'مكتملة': ['rgba(37,155,111,.12)', '#1e7355', '✓', 'rgba(37,155,111,.14)', '#1e7355', '#eef1ec', '#fff'],
      'جزئية': ['rgba(216,181,106,.2)', '#7a5d20', '◐', 'rgba(216,181,106,.2)', '#7a5d20', 'rgba(216,181,106,.32)', 'rgba(216,181,106,.05)'],
      'ناقصة': ['rgba(163,58,45,.1)', '#a33a2d', '—', 'rgba(163,58,45,.12)', '#a33a2d', 'rgba(163,58,45,.2)', '#fdf9f8'],
      'مسودّة': ['#f2f5f2', '#3b4d43', '⋯', '#f2f5f2', '#5f7167', '#eef1ec', '#fbfcfa']
    };

    const branches = defs.map(d => {
      const s = STATE[d[3]];
      return {
        label: d[0], source: d[1], state: d[3],
        srcDir: /[\u0600-\u06FF]/.test(d[1]) ? 'rtl' : 'ltr',
        stateBg: s[0], stateFg: s[1], mark: s[2],
        dotBg: s[3], dotFg: s[4], border: s[5], bg: s[6]
      };
    });

    return {
      branches,
      filledCount: defs.filter(d => d[2]).length,
      productName: this.props.productName || 'عرض بوربوينت — الكيمياء العضوية',
      helpDisplay: this.props.help === false ? 'none' : 'block',
      inheritNote: 'ملفّات اللغات ترث كل فرع أعلاه، ولا تُنشئ نسخة منه. التجاوز يُسجَّل للحقل الذي يختلف فعلًا — والباقي يبقى مرتبطًا بالأصل فيتحدّث معه.'
    };
  }
}
</script>
</body>
</html>
