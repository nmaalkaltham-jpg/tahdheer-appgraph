<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f0f0f1;font-family:Tajawal,"SF Arabic","Segoe UI",Tahoma,Arial,sans-serif}
a{color:#1e7355;text-decoration:none}
@keyframes tahSpin{to{transform:rotate(360deg)}}
@keyframes tahMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>

<template id="__bundler_thumbnail" data-bg-color="#1d2327">
<svg viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
<rect width="1200" height="800" fill="#1d2327"></rect>
<rect x="360" y="212" width="480" height="376" rx="44" fill="#123d2f"></rect>
<rect x="432" y="452" width="60" height="104" rx="14" fill="#5fd6a3"></rect>
<rect x="522" y="392" width="60" height="164" rx="14" fill="#5fd6a3"></rect>
<rect x="612" y="322" width="60" height="234" rx="14" fill="#d8b56a"></rect>
<rect x="702" y="272" width="60" height="284" rx="14" fill="#d8b56a"></rect>
<rect x="432" y="264" width="196" height="20" rx="10" fill="rgba(255,255,255,.28)"></rect>
</svg>
</template>

<dc-import name="TahIcons" hint-size="0,0"></dc-import>

<div dir="rtl" style="width:1280px;background:#dcdad5;box-sizing:border-box;padding:14px">

<div style="border:1px solid rgba(0,0,0,.12);border-radius:12px;overflow:hidden;background:#f0f0f1;box-shadow:0 4px 22px rgba(0,0,0,.1)">

<div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:11px 16px;background:#1d2327;color:#fff">
<span aria-hidden="true" style="flex:0 0 auto;width:30px;height:30px;border-radius:8px;background:linear-gradient(150deg,#1e7355,#123d2f);display:grid;place-items:center"><svg style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><use href="#i-gauge"></use></svg></span>
<b style="flex:0 0 auto;font-size:14px;font-weight:900">Analytics Pro</b>
<span style="font-size:11px;color:rgba(255,255,255,.55)">لوحة تحكّم ووردبريس — التحاضير الحديثة</span>
<div style="flex:1"></div>
<span style="box-sizing:border-box;padding:4px 11px;border-radius:7px;background:rgba(255,255,255,.1);font-size:10.5px;font-weight:800;color:rgba(255,255,255,.82);white-space:nowrap">{{ demoBadge }}</span>
</div>

<nav aria-label="أقسام Analytics Pro" style="display:flex;flex-wrap:wrap;gap:2px;padding:0 14px;background:#f0f0f1;border-bottom:1px solid #c3c4c7">
<sc-for list="{{ tabs }}" as="t" hint-placeholder-count="5">
<button type="button" onClick="{{ t.onClick }}" aria-current="{{ t.current }}" style="display:inline-flex;align-items:center;gap:8px;min-height:42px;padding:0 15px;border:1px solid {{ t.border }};border-bottom:0;border-radius:8px 8px 0 0;margin-bottom:-1px;background:{{ t.bg }};color:{{ t.fg }};font-family:Tajawal,sans-serif;font-size:12.5px;font-weight:{{ t.weight }};cursor:pointer;white-space:nowrap">
<svg aria-hidden="true" style="width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><use href="{{ t.icon }}"></use></svg>{{ t.label }}
<span style="display:{{ t.countDisplay }};box-sizing:border-box;padding:1px 6px;border-radius:5px;background:{{ t.countBg }};font-size:9px;font-weight:900;color:{{ t.countFg }}">{{ t.count }}</span>
</button>
</sc-for>
</nav>

<div style="padding:0;background:#f0f0f1;min-height:840px">
<sc-if value="{{ is.overview }}" hint-placeholder-val="{{ true }}">
<dc-import name="Tahdheer - Analytics Pro" hint-size="100%,900px"></dc-import>
</sc-if>
<sc-if value="{{ is.seo }}" hint-placeholder-val="{{ false }}">
<dc-import name="Tahdheer - SEO Center" hint-size="100%,860px"></dc-import>
</sc-if>
<sc-if value="{{ is.heatmap }}" hint-placeholder-val="{{ false }}">
<dc-import name="Tahdheer - Attention Map" hint-size="100%,860px"></dc-import>
</sc-if>
<sc-if value="{{ is.media }}" hint-placeholder-val="{{ false }}">
<dc-import name="Tahdheer - Media Library" hint-size="100%,840px"></dc-import>
</sc-if>
<sc-if value="{{ is.images }}" hint-placeholder-val="{{ false }}">
<dc-import name="Tahdheer - Image Ops" hint-size="100%,820px"></dc-import>
</sc-if>
</div>

</div>

<p style="margin:12px 4px 0;font-size:10.5px;line-height:1.8;color:rgba(0,0,0,.55);text-align:start">{{ note }}</p>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:960}}">
class Component extends DCLogic {
  state = { tab: 'overview' };

  renderVals() {
    const st = this.state;
    /*
     * One shell, five real sections. Each mounts through sc-if so the inactive
     * ones hold no DOM — the same lazy-tab rule the sections themselves follow.
     * Labels and order mirror analytics_pro_primary_tabs() in the theme.
     */
    const tabDefs = [
      ['overview', 'الرئيسية', '#i-gauge', '', ''],
      ['seo', 'SEO والتحليلات', '#i-search', '5', 'warn'],
      ['heatmap', 'خريطة الانتباه', '#i-eye', '', ''],
      ['media', 'مكتبة الوسائط', '#i-files', '3', 'bad'],
      ['images', 'تحسين الصور', '#i-sparkle', '', '']
    ];

    const is = {};
    tabDefs.forEach(t => { is[t[0]] = st.tab === t[0]; });

    return {
      is,
      demoBadge: 'محتوى معاينة — الأرقام توضيحية لا من متجرك',
      tabs: tabDefs.map(t => {
        const on = st.tab === t[0];
        const kind = t[4];
        return {
          label: t[1], icon: t[2], count: t[3],
          current: on ? 'page' : 'false',
          bg: on ? '#f6f7f7' : 'transparent',
          border: on ? '#c3c4c7' : 'transparent',
          fg: on ? '#1d2327' : '#50575e',
          weight: on ? '900' : '700',
          countDisplay: t[3] ? 'inline-flex' : 'none',
          countBg: kind === 'bad' ? 'rgba(163,58,45,.12)' : 'rgba(216,181,106,.2)',
          countFg: kind === 'bad' ? '#a33a2d' : '#7a5d20',
          onClick: () => this.setState({ tab: t[0] })
        };
      }),
      note: 'الأقسام الخمسة هي نفس الملفات المصمَّمة منفردة — تُركَّب هنا خلف شريط تبويبات واحد ليُرى النظام كوحدة. الأرقام محتوى معاينة كما اتفقنا؛ أمّا حالات الاتصال (Search Console مربوط · Merchant غير مربوط) فمبنية على ما يوجد في القالب فعلًا، لأن ادّعاء اتصال قائم يُضلّل حتى في المعاينة.'
    };
  }
}
</script>
</body>
</html>
