<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet data-dc-atomics>
<meta name="design_doc_mode" content="canvas">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#eceae5;font-family:Tajawal,"SF Arabic","Segoe UI",Tahoma,Arial,sans-serif}
a{color:#1e7355;text-decoration:none}
a:hover{color:#123d2f}
@keyframes tahMarquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</helmet>

<dc-import name="TahIcons" hint-size="0,0"></dc-import>

<div dir="rtl" style="width:{{ pageW }};background:#fff;color:#223129;box-sizing:border-box">

<dc-import name="TahHeader" hint-size="100%,132px"></dc-import>

<div style="padding:{{ pad }}">

<div style="display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:16px">
<sc-for list="{{ cases }}" as="c" hint-placeholder-count="3">
<button type="button" onClick="{{ c.onClick }}" aria-pressed="{{ c.pressed }}" style="display:inline-flex;align-items:center;min-height:32px;padding:0 12px;border:1px solid {{ c.border }};border-radius:8px;background:{{ c.bg }};color:{{ c.fg }};font-family:Tajawal,sans-serif;font-size:11px;font-weight:800;cursor:pointer;white-space:nowrap">{{ c.label }}</button>
</sc-for>
</div>

<header style="padding:{{ heroPad }};border:1px solid {{ hero.border }};border-radius:16px;background:{{ hero.bg }};margin-bottom:14px">
<div style="display:flex;flex-wrap:wrap;align-items:flex-start;gap:14px">
<span aria-hidden="true" style="flex:0 0 auto;display:grid;place-items:center;width:{{ hero.size }};height:{{ hero.size }};border-radius:15px;background:{{ hero.iconBg }};color:{{ hero.iconFg }}">
<svg style="width:48%;height:48%;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round"><use href="{{ hero.icon }}"></use></svg>
</span>
<div style="flex:1;min-width:200px">
<span style="display:inline-flex;align-items:center;box-sizing:border-box;padding:3px 10px;border-radius:6px;background:{{ hero.tagBg }};font-size:10px;font-weight:900;color:{{ hero.tagFg }};margin-bottom:8px">{{ hero.tag }}</span>
<h1 style="margin:0 0 8px;font-size:{{ h1 }};font-weight:900;color:#14261d;line-height:1.28;text-wrap:balance">{{ hero.title }}</h1>
<p style="margin:0;font-size:{{ intro }};line-height:1.85;color:#3b4d43;max-width:58ch">{{ hero.body }}</p>
<div style="display:{{ hero.urlDisplay }};margin-top:11px;padding:9px 11px;border-radius:9px;background:#fff;border:1px solid #e6e9e2">
<span dir="rtl" style="display:block;font-size:10px;font-weight:800;color:#5f7167;margin-bottom:3px;text-align:start">الرابط المطلوب</span>
<bdi dir="ltr" style="display:block;font:600 11px ui-monospace,Menlo,monospace;color:#14261d;word-break:break-all;text-align:start">{{ hero.url }}</bdi>
</div>
</div>
</div>
</header>

<section style="display:{{ moved.display }};padding:15px 17px;border:1px solid rgba(37,155,111,.3);border-radius:14px;background:rgba(37,155,111,.05);margin-bottom:14px">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:11px">
<svg aria-hidden="true" style="flex:0 0 auto;width:17px;height:17px;color:#1e7355;fill:none;stroke:currentColor;stroke-width:2.2"><use href="#i-refresh"></use></svg>
<div style="flex:1;min-width:200px;text-align:start">
<b style="display:block;font-size:13px;font-weight:900;color:#14261d;margin-bottom:3px">{{ moved.title }}</b>
<span style="font-size:11.5px;line-height:1.8;color:#3b4d43">{{ moved.body }}</span>
</div>
<a href="#" style="flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:{{ tap }};padding:0 18px;border-radius:11px;background:#1e7355;color:#fff;font-size:12.5px;font-weight:900;white-space:nowrap">{{ moved.action }}</a>
</div>
</section>

<form role="search" style="margin-bottom:14px">
<label for="tah-404-q" style="display:block;font-size:12px;font-weight:800;color:#5f7167;margin-bottom:7px">ابحث عمّا كنت تريده</label>
<div style="display:flex;align-items:center;gap:8px;border:1.5px solid #d3d8cf;border-radius:13px;background:#fff;padding:0 6px;padding-inline-start:15px;min-height:{{ fieldH }}">
<svg aria-hidden="true" style="flex:0 0 auto;width:19px;height:19px;color:#5f7167;fill:none;stroke:currentColor;stroke-width:2"><use href="#i-search"></use></svg>
<input id="tah-404-q" type="search" dir="auto" placeholder="{{ searchPlaceholder }}" style="flex:1;min-width:0;border:0;outline:none;background:none;font:700 {{ fieldFs }} Tajawal,sans-serif;color:#14261d">
<button type="submit" style="flex:0 0 auto;min-height:42px;padding:0 20px;border:0;border-radius:10px;background:#1e7355;color:#fff;font-family:Tajawal,sans-serif;font-size:13px;font-weight:900;cursor:pointer">بحث</button>
</div>
</form>

<section style="margin-bottom:14px">
<h2 style="margin:0 0 10px;font-size:14px;font-weight:900;color:#14261d;text-align:start">أو ابدأ من هنا</h2>
<div style="display:grid;grid-template-columns:{{ pathCols }};gap:9px">
<sc-for list="{{ paths }}" as="p" hint-placeholder-count="4">
<a href="#" style="display:flex;flex-direction:column;gap:8px;padding:14px;border:1px solid #e6e9e2;border-radius:12px;background:#fbfcfa">
<span aria-hidden="true" style="width:34px;height:34px;border-radius:10px;background:{{ p.tint }};color:{{ p.fg }};display:grid;place-items:center"><svg style="width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><use href="{{ p.icon }}"></use></svg></span>
<b style="font-size:13px;font-weight:900;color:#14261d;text-align:start">{{ p.title }}</b>
<span style="font-size:11px;line-height:1.7;color:#5f7167;text-align:start">{{ p.body }}</span>
<span style="display:flex;align-items:center;gap:5px;margin-top:auto;padding-top:9px;border-top:1px solid #eef1ec;font-size:11px;font-weight:800;color:#1e7355">{{ p.cta }}<svg aria-hidden="true" style="width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round"><use href="#i-chev"></use></svg></span>
</a>
</sc-for>
</div>
</section>

<section style="padding:15px 17px;border:1px solid #e6e9e2;border-radius:14px;background:#fbfcfa">
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:9px;margin-bottom:11px">
<h2 style="margin:0;flex:1;min-width:0;font-size:13.5px;font-weight:900;color:#14261d;text-align:start">الأكثر مبيعًا — بديل سريع</h2>
<a href="#" style="font-size:11.5px;font-weight:800;color:#1e7355;white-space:nowrap">كل المنتجات</a>
</div>
<ul style="display:grid;grid-template-columns:{{ cardCols }};gap:10px;list-style:none;margin:0;padding:0">
<sc-for list="{{ products }}" as="pr" hint-placeholder-count="3">
<li><dc-import name="TahProductCard" p="{{ pr }}" hint-size="100%,340px"></dc-import></li>
</sc-for>
</ul>
</section>

<p style="margin:14px 0 0;font-size:10.5px;line-height:1.8;color:#5f7167;text-align:start">{{ devNote }}</p>

</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1120,&quot;height&quot;:900},&quot;mobile&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  state = { kind: 'missing' };

  renderVals() {
    const mobile = !!this.props.mobile;
    const pick = (m, d) => (mobile ? m : d);
    const kind = this.state.kind;

    /*
     * Three distinct 404 causes, three different honest answers. Treating them
     * alike is the usual mistake: a retired product needs a replacement, a typo
     * needs a search, a mistyped URL needs orientation. The theme already has
     * inc/seo-404-redirections.php, so a known move should redirect before this
     * page is ever reached — this page is the genuinely-unknown case.
     */
    const heroes = {
      missing: {
        icon: '#i-search', tag: 'الصفحة غير موجودة',
        tagBg: '#f2f5f2', tagFg: '#5f7167',
        iconBg: '#f2f5f2', iconFg: '#5f7167',
        border: '#e6e9e2', bg: '#fbfcfa',
        title: 'لم نجد هذه الصفحة',
        body: 'الرابط لا يشير إلى شيء عندنا. قد يكون منسوخًا ناقصًا أو قديمًا — والملف الذي تريده غالبًا موجود باسم آخر.',
        url: 'tahdheer.com/product/chemistry-gr12-final',
        urlDisplay: 'block'
      },
      retired: {
        icon: '#i-refresh', tag: 'منتج مسحوب',
        tagBg: 'rgba(216,181,106,.2)', tagFg: '#7a5d20',
        iconBg: 'rgba(216,181,106,.2)', iconFg: '#7a5d20',
        border: 'rgba(216,181,106,.45)', bg: 'rgba(216,181,106,.07)',
        title: 'هذا الملف سُحب — وله نسخة أحدث',
        body: 'أوقفنا هذه النسخة لأنها بُنيت على منهج سابق. النسخة المحدَّثة تغطّي المنهج الحالي، ومن اشترى القديمة يجدها في «تنزيلاتي» مجانًا.',
        url: 'tahdheer.com/product/math-gr4-2024',
        urlDisplay: 'block'
      },
      typo: {
        icon: '#i-info', tag: 'رابط غير مكتمل',
        tagBg: '#f2f5f2', tagFg: '#5f7167',
        iconBg: '#f2f5f2', iconFg: '#5f7167',
        border: '#e6e9e2', bg: '#fbfcfa',
        title: 'الرابط يبدو مقطوعًا',
        body: 'ينقص الرابط جزؤه الأخير — يحدث كثيرًا عند النسخ من رسالة أو محادثة. ابحث بالاسم بدلًا منه، أو ابدأ من المرحلة.',
        url: 'tahdheer.com/product/',
        urlDisplay: 'block'
      }
    };

    const movedMap = {
      missing: { display: 'none' },
      retired: {
        display: 'block',
        title: 'النسخة البديلة جاهزة',
        body: 'تحضير مادة الرياضيات — الصف الرابع، المنهج الحالي · 45.00 ر.س',
        action: 'افتح النسخة المحدَّثة'
      },
      typo: { display: 'none' }
    };

    const prodDefs = [
      ['حزمة تحاضير اللغة العربية — الفصل الأول', 'المرحلة الابتدائية', 'Word', '4.9', '341', '95.00', '', 'الأكثر مبيعًا', '#14261d', '#fff'],
      ['اختبارات نهائية محلولة — الرياضيات', 'المرحلة المتوسطة', 'PDF', '4.8', '287', '38.00', '', '', '', ''],
      ['وسائل صفّية جاهزة — 60 وسيلة', 'وسائل تعليمية', 'PDF', '4.9', '265', '42.00', '', '', '', '']
    ];

    return {
      pageW: pick('390px', '1120px'),
      pad: pick('16px 16px 28px', '20px 26px 34px'),
      heroPad: pick('18px 16px', '22px 24px'),
      h1: pick('21px', '27px'),
      intro: pick('13px', '14.5px'),
      fieldH: pick('52px', '54px'),
      fieldFs: pick('14px', '15px'),
      pathCols: pick('1fr 1fr', 'repeat(4,minmax(0,1fr))'),
      cardCols: pick('1fr 1fr', 'repeat(3,minmax(0,1fr))'),
      tap: pick('48px', '42px'),

      cases: [['missing', 'صفحة غير موجودة'], ['retired', 'منتج مسحوب'], ['typo', 'رابط مقطوع']].map(c => ({
        label: c[1],
        pressed: kind === c[0] ? 'true' : 'false',
        border: kind === c[0] ? '#1e7355' : '#dde3dc',
        bg: kind === c[0] ? 'rgba(37,155,111,.07)' : '#fbfcfa',
        fg: kind === c[0] ? '#1e7355' : '#5f7167',
        onClick: () => this.setState({ kind: c[0] })
      })),

      hero: Object.assign({}, heroes[kind], { size: pick('48px', '56px') }),
      moved: movedMap[kind],
      searchPlaceholder: kind === 'retired' ? 'تحضير رياضيات رابع' : 'اسم المادة أو الصف أو نوع الملف',

      paths: [
        { title: 'المرحلة الابتدائية', body: '١٬٤٢٠ ملفًا للصفوف 1 — 6', cta: 'تصفّح', icon: '#i-blocks', tint: 'rgba(216,181,106,.16)', fg: '#7a5d20' },
        { title: 'المرحلة المتوسطة', body: '٩٨٦ ملفًا للصفوف 7 — 9', cta: 'تصفّح', icon: '#i-book', tint: 'rgba(37,155,111,.13)', fg: '#1e7355' },
        { title: 'المرحلة الثانوية', body: '١٬١٣٠ ملفًا للصفوف 10 — 12', cta: 'تصفّح', icon: '#i-files', tint: 'rgba(18,61,47,.10)', fg: '#123d2f' },
        { title: 'اسأل الدعم', body: 'نجد لك الملف أو نُعدّه بالطلب', cta: 'واتساب', icon: '#i-headset', tint: 'rgba(37,155,111,.13)', fg: '#1e7355' }
      ],

      products: prodDefs.map(p => ({
        title: p[0], cat: p[1], format: p[2], rating: p[3], reviews: p[4],
        price: p[5], was: p[6], badge: p[7], badgeBg: p[8], badgeFg: p[9]
      })),

      devNote: 'ملاحظة تنفيذ: الصفحة تُرجع 404 فعليًا لا 200 — وإلا فُهرست كصفحة صالحة. والانتقالات المعروفة تُعالَج قبل الوصول إلى هنا في inc/seo-404-redirections.php.'
    };
  }
}
</script>
</body>
</html>
