<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<section aria-labelledby="hrv-h" style="direction:rtl;font-family:Tajawal,'SF Arabic','Segoe UI',Tahoma,Arial,sans-serif;padding:{{ pad }}">
<div style="width:{{ wrapW }};margin-inline:auto">

<div style="display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:{{ headGap }};margin-bottom:{{ headMb }}">
<div style="order:{{ statsOrder }};display:flex;flex-wrap:wrap;gap:{{ statGap }}">
<sc-for list="{{ stats }}" as="s" hint-placeholder-count="3">
<div style="display:flex;flex-direction:column;gap:3px;padding:{{ statPad }};border:1px solid #e6e9e2;border-radius:12px;background:#fbfcfa;min-width:{{ statMin }}">
<div style="display:flex;align-items:baseline;gap:4px;font-size:{{ statSize }};font-weight:900;color:#14261d;line-height:1.1">{{ s.value }}<span style="font-size:.5em;font-weight:800;color:#5f7167">{{ s.unit }}</span></div>
<div style="font-size:11.5px;font-weight:700;color:#5f7167">{{ s.label }}</div>
</div>
</sc-for>
</div>
<div>
<span style="display:block;font-size:12px;font-weight:800;letter-spacing:.1em;color:#5f7167;margin-bottom:6px">آراء موثقة</span>
<h2 id="hrv-h" style="margin:0 0 10px;font-size:{{ h2 }};font-weight:900;color:#14261d;letter-spacing:-.01em;text-wrap:balance">{{ heading }}</h2>
<div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px">
<div role="img" aria-label="{{ starsLabel }}" style="display:flex;gap:2px">
<sc-for list="{{ heroStars }}" as="st" hint-placeholder-count="5">
<span style="position:relative;display:block;width:17px;height:17px;color:#e0e5dd"><svg aria-hidden="true" style="position:absolute;inset:0;width:17px;height:17px;fill:currentColor;stroke:none"><use href="#i-star"></use></svg><span style="position:absolute;inset-block:0;inset-inline-start:0;width:{{ st.fill }};overflow:hidden;color:#d8b56a;animation:{{ st.anim }}"><svg aria-hidden="true" style="width:17px;height:17px;fill:currentColor;stroke:none"><use href="#i-star"></use></svg></span></span>
</sc-for>
</div>
<b style="font-size:15px;font-weight:900;color:#14261d">{{ avgText }}</b>
<span style="font-size:13.5px;color:#5f7167">من {{ totalText }} تقييمًا</span>
</div>
</div>
</div>

<div style="display:{{ listDisplay }};grid-template-columns:{{ cols }};gap:{{ gap }};overflow-x:{{ overflow }};padding-bottom:{{ listPb }};scrollbar-width:none">
<sc-for list="{{ items }}" as="r" hint-placeholder-count="3">
<figure style="flex:{{ cardFlex }};width:{{ cardW }};margin:0;padding:{{ cardPad }};border-radius:16px;border:1px solid #e6e9e2;background:#fff;display:flex;flex-direction:column;gap:13px;transition:.18s ease;animation:{{ r.anim }}" style-hover="border-color:#c9d4cd;transform:translateY(-2px);box-shadow:0 12px 28px rgba(20,45,33,.08)">
<div style="display:flex;align-items:center;justify-content:space-between;gap:10px">
<span role="img" aria-label="{{ r.ratingLabel }}" style="color:#d8b56a;font-size:13.5px;letter-spacing:2px">{{ r.starGlyphs }}</span>
<span style="display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:900;color:#1e7355"><svg aria-hidden="true" style="width:12px;height:12px;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"><use href="#i-check"></use></svg>شراء موثق</span>
</div>
<blockquote style="margin:0;font-size:{{ quoteSize }};line-height:1.9;color:#223129;flex:1;text-wrap:pretty">«{{ r.quote }}»</blockquote>
<a href="#" style="display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:11px;background:#f7f9f6;border:1px solid #eef1ec;text-decoration:none" style-hover="border-color:#c9d4cd;background:#fff">
<span aria-hidden="true" style="flex:0 0 auto;width:34px;height:34px;border-radius:9px;background:#e8ece7;display:grid;place-items:center;color:#5f7167"><svg style="width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><use href="{{ r.iconRef }}"></use></svg></span>
<span style="flex:1;min-width:0"><span style="display:block;font-size:10.5px;font-weight:700;color:#5f7167;margin-bottom:1px">عن المنتج</span><b style="display:block;font-size:12.5px;font-weight:800;color:#14261d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ r.product }}</b></span>
<svg aria-hidden="true" style="flex:0 0 auto;width:14px;height:14px;color:#1e7355;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round"><use href="#i-chev"></use></svg>
</a>
<figcaption style="display:flex;align-items:center;gap:11px;padding-top:13px;border-top:1px solid #f0f3ef">
<span aria-hidden="true" style="width:36px;height:36px;border-radius:50%;background:{{ r.avatarBg }};color:{{ r.avatarFg }};display:grid;place-items:center;font-weight:900;font-size:14px">{{ r.initial }}</span>
<span style="flex:1;min-width:0"><b style="display:block;font-size:13px;font-weight:900;color:#14261d">{{ r.name }}</b><span style="font-size:11.5px;color:#5f7167">{{ r.role }}</span></span>
<time datetime="{{ r.iso }}" style="flex:0 0 auto;font-size:11px;color:#5f7167">{{ r.date }}</time>
</figcaption>
</figure>
</sc-for>
</div>

<div style="display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:{{ footMt }}">
<a href="#" style="display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border:1px solid #d3d8cf;border-radius:11px;background:#fff;color:#14261d;font-weight:800;font-size:13.5px;text-decoration:none;flex:{{ footFlex }}" style-hover="border-color:#1e7355;color:#1e7355">كل التقييمات<svg aria-hidden="true" style="width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round"><use href="#i-chev"></use></svg></a>
<div style="display:flex;flex-wrap:wrap;gap:6px;flex:{{ trustFlex }}">
<sc-for list="{{ trust }}" as="t" hint-placeholder-count="3">
<span style="display:inline-flex;align-items:center;gap:6px;padding:9px 12px;border-radius:10px;background:#fbfcfa;border:1px solid #e6e9e2;font-size:11.5px;font-weight:800;color:#3b4d43"><svg aria-hidden="true" style="width:13px;height:13px;color:#1e7355;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round"><use href="{{ t.iconRef }}"></use></svg>{{ t.label }}</span>
</sc-for>
</div>
</div>

</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1200,&quot;height&quot;:560},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  /*
   * Store-wide social proof — deliberately NOT the PDP reviews component.
   * Homepage reviews answer "is this shop credible?", so each card names the
   * product it came from and links to it; there is no sort/filter/helpful
   * interaction, which belongs on a product page.
   */
  renderVals() {
    const compact = !!this.props.compact;
    const motion = this.props.motion !== false;
    const avg = 4.9;
    const total = 2418;

    const items = [
      {
        id: 'h1', name: 'أ. نورة الحربي', role: 'معلّمة رياضيات — الرياض', initial: 'ن', rating: 5,
        quote: 'وفّر عليّ أسبوعًا كاملًا في بداية الفصل. الملفات مرتبة والأهداف مكتوبة بشكل يوافق نموذج المدرسة تمامًا.',
        product: 'تحضير الرياضيات — الصف الرابع', iconRef: '#i-grid', iso: '2026-08-14', date: '14 أغسطس'
      },
      {
        id: 'h2', name: 'أ. خالد العتيبي', role: 'وكيل شؤون تعليمية — جدة', initial: 'خ', rating: 5,
        quote: 'أفضل ما فيه أن كل شيء قابل للتعديل فعلًا. عدّلت اسم المدرسة والشعار على أربعين ملفًا في أقل من ساعة.',
        product: 'حزمة المرحلة الابتدائية', iconRef: '#i-blocks', iso: '2026-08-09', date: '9 أغسطس'
      },
      {
        id: 'h3', name: 'أ. سارة القحطاني', role: 'معلّمة علوم — الدمام', initial: 'س', rating: 5,
        quote: 'طلبت مساعدة على واتساب الساعة العاشرة مساءً ووصلني الرد خلال دقائق. خدمة نادرة صراحة.',
        product: 'أوراق عمل العلوم — الثاني المتوسط', iconRef: '#i-files', iso: '2026-08-03', date: '3 أغسطس'
      }
    ];

    return {
      pad: compact ? '32px 0 0' : '64px 0 0',
      wrapW: compact ? '100%' : 'min(1200px,100% - 64px)',
      h2: compact ? '21px' : 'clamp(26px,2.4vw,32px)',
      headGap: compact ? '16px' : '24px',
      headMb: compact ? '16px' : '24px',
      statsOrder: compact ? '2' : '0',
      statGap: compact ? '8px' : '10px',
      statPad: compact ? '11px 13px' : '13px 16px',
      statMin: compact ? '92px' : '104px',
      statSize: compact ? '20px' : '24px',
      listDisplay: compact ? 'flex' : 'grid',
      cols: 'repeat(3,minmax(0,1fr))',
      gap: compact ? '12px' : '16px',
      overflow: compact ? 'auto' : 'visible',
      listPb: compact ? '8px' : '0',
      cardFlex: compact ? '0 0 auto' : '1 1 auto',
      cardW: compact ? '286px' : 'auto',
      cardPad: compact ? '18px' : '24px',
      quoteSize: compact ? '13.5px' : '15px',
      footMt: compact ? '16px' : '20px',
      footFlex: compact ? '1 1 100%' : '0 0 auto',
      trustFlex: compact ? '1 1 100%' : '1 1 auto',
      heading: compact ? 'معلّمون يوصون بنا' : 'أكثر من ٢٤٠٠ معلّم قيّموا ملفاتنا',
      avgText: avg.toFixed(1),
      totalText: total.toLocaleString('ar-EG'),
      starsLabel: 'متوسط تقييم المتجر ' + avg + ' من 5',
      heroStars: [0, 1, 2, 3, 4].map(i => ({
        fill: Math.max(0, Math.min(1, avg - i)) * 100 + '%',
        anim: motion ? 'tahStarIn .5s ease-out ' + (i * 90) + 'ms both' : 'none'
      })),
      stats: [
        { value: '٩٧', unit: '%', label: 'يوصون بالمتجر' },
        { value: '٤٬٢٠٠', unit: '+', label: 'ملف جاهز' },
        { value: '١٨٬٦٠٠', unit: '', label: 'معلّم ومعلّمة' }
      ],
      trust: [
        { label: 'مشتريات موثقة', iconRef: '#i-shield' },
        { label: 'تقييمات حقيقية', iconRef: '#i-check' },
        { label: 'دعم سريع', iconRef: '#i-headset' }
      ],
      items: items.map((r, i) => ({
        ...r,
        starGlyphs: '★★★★★'.slice(0, r.rating),
        ratingLabel: 'التقييم ' + r.rating + ' من 5',
        avatarBg: i % 2 ? 'rgba(216,181,106,.18)' : 'rgba(37,155,111,.12)',
        avatarFg: i % 2 ? '#7a5d20' : '#1e7355',
        anim: motion ? 'tahFadeUp .5s ease-out ' + (i * 90) + 'ms both' : 'none'
      }))
    };
  }
}
</script>
</body>
</html>
