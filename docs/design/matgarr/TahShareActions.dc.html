<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;display:flex;flex-wrap:wrap;align-items:center;gap:{{ outerGap }};font-family:Tajawal,'SF Arabic','Segoe UI',Tahoma,Arial,sans-serif">

<sc-if value="{{ hasLabel }}" hint-placeholder-val="{{ true }}">
<span style="font-size:11.5px;font-weight:800;color:#5f7167">شارك المنتج</span>
</sc-if>

<sc-if value="{{ isExpandable }}" hint-placeholder-val="{{ false }}">
<button type="button" onClick="{{ onToggle }}" aria-expanded="{{ expandedAria }}" aria-controls="tah-share-list" style="display:inline-flex;align-items:center;gap:7px;min-height:{{ tap }};padding:0 14px;border:1px solid {{ toggleBorder }};border-radius:10px;background:{{ toggleBg }};color:{{ toggleFg }};font-family:Tajawal,sans-serif;font-size:12.5px;font-weight:800;cursor:pointer;transition:.16s ease">
<svg aria-hidden="true" style="width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><use href="#i-share"></use></svg>مشاركة
</button>
</sc-if>

<ul id="tah-share-list" style="display:{{ listDisplay }};flex-wrap:{{ listWrap }};align-items:center;gap:{{ gap }};list-style:none;margin:0;padding:0;overflow-x:{{ listOverflow }};max-width:100%;scrollbar-width:none">
<sc-for list="{{ items }}" as="p" hint-placeholder-count="6">
<li style="flex:0 0 auto;animation:{{ p.anim }}">
<button type="button" onClick="{{ p.onClick }}" aria-label="{{ p.aria }}" title="{{ p.tip }}" style="display:inline-flex;align-items:center;justify-content:center;gap:6px;width:{{ p.w }};min-width:{{ p.w }};height:{{ tap }};min-height:{{ tap }};padding:{{ p.pad }};border:1px solid {{ p.border }};border-radius:{{ p.radius }};background:{{ p.bg }};color:{{ p.fg }};font-family:Tajawal,sans-serif;font-size:12px;font-weight:800;cursor:pointer;transition:.16s ease" style-hover="border-color:#1e7355;color:#1e7355;transform:translateY(-2px);box-shadow:0 6px 14px rgba(20,45,33,.10)">
<svg aria-hidden="true" style="width:{{ iconSize }};height:{{ iconSize }};flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round"><use href="{{ p.iconRef }}"></use></svg>
<sc-if value="{{ p.showText }}" hint-placeholder-val="{{ false }}"><span>{{ p.label }}</span></sc-if>
</button>
</li>
</sc-for>
</ul>

<sc-if value="{{ toast.show }}" hint-placeholder-val="{{ false }}">
<div role="status" aria-live="polite" style="position:absolute;inset-block-end:calc(100% + 8px);inset-inline-start:0;z-index:5;display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:10px;background:#14261d;color:#fff;font-size:12px;font-weight:800;white-space:nowrap;box-shadow:0 8px 20px rgba(20,45,33,.24);animation:{{ toast.anim }}">
<svg aria-hidden="true" style="width:13px;height:13px;color:#5fd6a3;fill:none;stroke:currentColor;stroke-width:2.6;stroke-linecap:round;stroke-linejoin:round"><use href="#i-check"></use></svg>{{ toast.text }}
</div>
</sc-if>

</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:520,&quot;height&quot;:110},&quot;shareStyle&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;row&quot;,&quot;floating&quot;,&quot;expandable&quot;],&quot;default&quot;:&quot;row&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;compact&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;showLabel&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;motion&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;عرض بوربوينت — الكيمياء العضوية&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;url&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://tahdheer.example/product/organic-chemistry-pptx&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;order&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string[]&quot;},&quot;off&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string,boolean&gt;&quot;},&quot;onEvent&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(name:string)=&gt;void&quot;}}">
class Component extends DCLogic {
  /*
   * Share actions. Two honesty rules drive the implementation:
   *
   * 1. Instagram and TikTok have no reliable public web-share endpoint. So those
   *    buttons use navigator.share when the OS offers it (which is what actually
   *    surfaces the apps), and otherwise copy the link and SAY they copied it.
   *    They never report a share that did not happen.
   * 2. The generic button uses the real Web Share API and falls back to
   *    clipboard, with a live-region toast either way.
   */
  state = { expanded: false, toast: null, canNativeShare: false };

  componentDidMount() {
    if (typeof navigator !== 'undefined' && navigator.share) this.setState({ canNativeShare: true });
  }

  componentWillUnmount() { if (this._t) clearTimeout(this._t); }

  fire(name) {
    try { document.dispatchEvent(new CustomEvent('tahdheer:' + name, { detail: { url: this.url() } })); } catch (e) {}
    if (this.props.onEvent) this.props.onEvent(name);
  }

  url() { return this.props.url || 'https://tahdheer.example/product/organic-chemistry-pptx'; }
  title() { return this.props.title || 'عرض بوربوينت — الكيمياء العضوية'; }

  toast(text) {
    this.setState({ toast: text });
    if (this._t) clearTimeout(this._t);
    this._t = setTimeout(() => this.setState({ toast: null }), 2600);
  }

  copy(msg) {
    const link = this.url();
    const done = () => this.toast(msg || 'تم نسخ رابط المنتج');
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(link).then(done, () => this.toast('تعذّر النسخ — انسخ الرابط يدويًا'));
      } else {
        const ta = document.createElement('textarea');
        ta.value = link; ta.setAttribute('readonly', '');
        ta.style.position = 'absolute'; ta.style.inset = '-9999px';
        document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
        done();
      }
    } catch (e) { this.toast('تعذّر النسخ — انسخ الرابط يدويًا'); }
    this.fire('copy_product_link');
  }

  nativeShare(fallbackMsg, event) {
    this.fire(event);
    if (navigator.share) {
      navigator.share({ title: this.title(), text: this.title(), url: this.url() }).catch(() => {});
      return;
    }
    this.copy(fallbackMsg);
  }

  open(href, event) {
    this.fire(event);
    try { window.open(href, '_blank', 'noopener,noreferrer'); } catch (e) {}
  }

  renderVals() {
    const style = this.props.shareStyle || 'row';
    const compact = !!this.props.compact;
    const motion = this.props.motion !== false;
    const t = encodeURIComponent(this.title());
    const u = encodeURIComponent(this.url());
    // `hidden` is a reserved HTML attribute, so the off-switch map is `off`.
    const fallback = ['general', 'whatsapp', 'telegram', 'x', 'instagram', 'tiktok'];
    const order = Array.isArray(this.props.order) ? this.props.order : fallback;
    const off = (this.props.off && typeof this.props.off === 'object') ? this.props.off : {};

    const defs = {
      general: {
        label: 'مشاركة', iconRef: '#i-share',
        aria: this.state.canNativeShare ? 'شارك المنتج عبر خيارات جهازك' : 'انسخ رابط المنتج',
        tip: this.state.canNativeShare ? 'مشاركة' : 'نسخ الرابط',
        run: () => this.nativeShare('تم نسخ رابط المنتج', 'product_share')
      },
      whatsapp: {
        label: 'واتساب', iconRef: '#i-whatsapp', aria: 'شارك المنتج على واتساب', tip: 'واتساب',
        run: () => this.open('https://wa.me/?text=' + t + '%20' + u, 'share_whatsapp')
      },
      telegram: {
        label: 'تيليجرام', iconRef: '#i-telegram', aria: 'شارك المنتج على تيليجرام', tip: 'تيليجرام',
        run: () => this.open('https://t.me/share/url?url=' + u + '&text=' + t, 'share_telegram')
      },
      x: {
        label: 'X', iconRef: '#i-x', aria: 'شارك المنتج على منصة X', tip: 'X',
        run: () => this.open('https://twitter.com/intent/tweet?text=' + t + '&url=' + u, 'share_x')
      },
      instagram: {
        label: 'انستقرام', iconRef: '#i-instagram',
        aria: this.state.canNativeShare ? 'شارك المنتج عبر انستقرام من خيارات جهازك' : 'انسخ رابط المنتج للنشر على انستقرام',
        tip: this.state.canNativeShare ? 'انستقرام' : 'انسخ الرابط — انستقرام لا يدعم المشاركة من المتصفح',
        run: () => this.nativeShare('تم نسخ الرابط — الصقه في انستقرام', 'share_instagram')
      },
      tiktok: {
        label: 'تيك توك', iconRef: '#i-tiktok',
        aria: this.state.canNativeShare ? 'شارك المنتج عبر تيك توك من خيارات جهازك' : 'انسخ رابط المنتج للنشر على تيك توك',
        tip: this.state.canNativeShare ? 'تيك توك' : 'انسخ الرابط — تيك توك لا يدعم المشاركة من المتصفح',
        run: () => this.nativeShare('تم نسخ الرابط — الصقه في تيك توك', 'share_tiktok')
      }
    };

    const isExpandable = style === 'expandable';
    const open = this.state.expanded;
    const tap = compact ? '44px' : '38px';
    const shape = style === 'floating'
      ? { radius: '50%', w: tap, pad: '0', bg: '#fff', border: '#e6e9e2', showText: false }
      : { radius: '10px', w: 'auto', pad: '0 12px', bg: '#fbfcfa', border: '#e6e9e2', showText: false };

    const list = order.filter(k => defs[k] && !off[k]);

    return {
      outerGap: compact ? '8px' : '10px',
      gap: this.props.gap || (style === 'floating' ? '7px' : '6px'),
      iconSize: this.props.iconSize || (compact ? '17px' : '16px'),
      tap,
      hasLabel: this.props.showLabel !== false && !isExpandable && !compact,
      isExpandable,
      expandedAria: open ? 'true' : 'false',
      toggleBg: open ? 'rgba(30,115,85,.07)' : '#fbfcfa',
      toggleBorder: open ? '#1e7355' : '#e6e9e2',
      toggleFg: open ? '#1e7355' : '#3b4d43',
      onToggle: () => this.setState(s => ({ expanded: !s.expanded })),
      listDisplay: isExpandable && !open ? 'none' : 'flex',
      listWrap: compact ? 'nowrap' : 'wrap',
      listOverflow: compact ? 'auto' : 'visible',
      items: list.map((k, i) => {
        const d = defs[k];
        return {
          label: d.label, iconRef: d.iconRef, aria: d.aria, tip: d.tip,
          ...shape,
          w: shape.w === 'auto' ? tap : shape.w,
          onClick: d.run,
          anim: motion ? 'tahSharePop .26s cubic-bezier(.34,1.4,.64,1) ' + (i * 45) + 'ms both' : 'none'
        };
      }),
      toast: {
        show: !!this.state.toast,
        text: this.state.toast || '',
        anim: motion ? 'tahFadeUp .22s ease-out both' : 'none'
      }
    };
  }
}
</script>
</body>
</html>
